[package]
name = "lath"
version = "0.1.0"
description = "Lath: ZK-compressed agent event log on Solana (Light Protocol)"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "lath"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "light-sdk/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
light-sdk = { version = "0.23.0", features = ["anchor", "keccak"] }

[dev-dependencies]
hex = "0.4"
